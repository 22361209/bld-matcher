{% macro choice_heading(scope, column_id, label, filter_key, options, selected) %}
  <div class="data-grid-column-heading">
    <span class="data-grid-static-column-label">{{ label }}</span>
    <button
      class="data-grid-filter-trigger{% if selected %} active{% endif %}"
      type="button"
      data-column-filter-trigger
      aria-label="筛选{{ label }}{% if selected %}，已选择 {{ selected|length }} 项{% endif %}"
      aria-haspopup="dialog"
      aria-expanded="false"
      aria-controls="{{ scope }}-filter-{{ column_id }}"
    ><span aria-hidden="true"></span></button>
  </div>
  <div
    class="data-grid-filter-panel"
    id="{{ scope }}-filter-{{ column_id }}"
    role="dialog"
    aria-label="筛选{{ label }}"
    data-column-filter-panel
    data-filter-key="{{ filter_key }}"
    hidden
  >
    <div class="data-grid-filter-header"><strong>筛选{{ label }}</strong><button type="button" data-column-filter-close aria-label="关闭{{ label }}筛选">×</button></div>
    <label class="data-grid-filter-search"><span>搜索候选项</span><input type="search" autocomplete="off" placeholder="输入关键词" data-column-filter-search></label>
    <div class="data-grid-filter-bulk"><button class="linear-button subtle" type="button" data-column-filter-select-all>全选</button><button class="linear-button subtle" type="button" data-column-filter-select-none>全不选</button><span data-column-filter-selection aria-live="polite"></span></div>
    <div class="data-grid-filter-options" role="group" aria-label="{{ label }}候选项">
      {% for option in options %}
        <label class="data-grid-filter-option" data-column-filter-option><input type="checkbox" value="{{ option.value }}" {% if not selected or option.value in selected %}checked{% endif %}><span>{{ option.label }}</span><small>{{ option.count }}</small></label>
      {% else %}<p class="data-grid-filter-empty">暂无可筛选项。</p>{% endfor %}
    </div>
    <p class="data-grid-filter-empty-search" data-column-filter-no-match hidden>没有匹配项。</p><p class="data-grid-filter-validation" data-column-filter-validation aria-live="polite"></p>
    <div class="data-grid-filter-actions"><button class="linear-button subtle" type="button" data-column-filter-reset>重置筛选</button><button class="linear-button primary" type="button" data-column-filter-apply>应用</button></div>
  </div>
{% endmacro %}
