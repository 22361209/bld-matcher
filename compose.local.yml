name: bld-local

services:
  bld-matcher:
    build: .
    image: bld-matcher:local
    container_name: bld-matcher-local
    restart: unless-stopped
    labels:
      bld.local.env-sha256: "${BLD_LOCAL_ENV_DIGEST:-unset}"
    ports:
      - "127.0.0.1:5055:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      TZ: Asia/Shanghai
      BLD_DATA_DIR: /app/data
      BLD_UPLOAD_DIR: /app/uploads
      BLD_OUTPUT_DIR: /app/outputs
