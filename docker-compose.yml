services:
  bld-image-migrate:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    command: ["python", "tools/migrate_product_images.py", "--apply", "--allow-failures"]
    restart: "no"

  bld-matcher:
    build: .
    container_name: bld-matcher
    depends_on:
      bld-image-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "5055:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - TZ=Asia/Shanghai
      - BLD_DATA_DIR=/app/data
      - BLD_UPLOAD_DIR=/app/uploads
      - BLD_OUTPUT_DIR=/app/outputs

  bld-retention:
    build: .
    profiles: ["maintenance"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - TZ=Asia/Shanghai
    command: ["sh", "-c", "python -m scripts.init_database && exec python -m scripts.cleanup_runtime --apply"]
    restart: "no"
